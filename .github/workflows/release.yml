name: Release

# Stable releases: push a semver tag (vX.Y.Z or vX.Y.Z-rc.1) that points at a commit on main.
# Snapshot releases: every push to main without a tag gets <package.json version>-<UTC yyyymmddHHMMSS>.

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          pkg_version=$(jq -r .version package.json)

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::Tag $tag is not a valid semver version"
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $tag does not point at a commit on main"
              exit 1
            fi
            if [[ "${version%%[-+]*}" != "${pkg_version%%[-+]*}" ]]; then
              echo "::warning::Tag $tag does not match package.json version $pkg_version"
            fi
            prerelease=$([[ "$version" == *-* ]] && echo true || echo false)
            kind=tagged
          else
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "::error::Snapshot releases are only built from main"
              exit 1
            fi
            # A semver tag on this commit gets its own run from the tag push.
            if git tag --points-at "$GITHUB_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Commit is tagged, leaving the release to the tag run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${pkg_version%%[-+]*}-$(date -u +%Y%m%d%H%M%S)"
            tag="v$version"
            prerelease=true
            kind=snapshot
          fi

          echo "Releasing $tag ($kind)"
          {
            echo "skip=false"
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.version.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=edge,enable=${{ steps.version.outputs.kind == 'snapshot' }}
            type=sha,format=short
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          args=(--title "$TAG" --generate-notes --notes "Docker image: \`docker pull $image:$VERSION\`")

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          else
            args+=(--latest)
            # Stable notes cover everything since the previous stable tag, not just the last snapshot.
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$GITHUB_SHA^" 2>/dev/null || true)
          fi
          if [[ -n "$prev" ]]; then
            args+=(--notes-start-tag "$prev")
          fi

          # For snapshots the tag doesn't exist yet; --target creates it on this commit.
          gh release create "$TAG" --target "$GITHUB_SHA" "${args[@]}"
